name: wif-regex-test
on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=britive" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Show claims (not the token)
        run: |
          P=$(echo "${{ steps.oidc.outputs.token }}" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="$P="; done
          echo "$P" | base64 -d | jq '{sub, repository, ref, aud, iss}'

      - name: Debug Britive token exchange
        run: |
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=britive" | jq -r .value)
          echo "::add-mask::$JWT"
          curl -s -o resp.txt -w "HTTP %{http_code}\n" \
            -H "Authorization: TOKEN OIDC::$JWT" \
            https://bira.pr2.aws.britive-app.com/api/access
          cat resp.txt; echo

      - name: Authenticate to Britive
        run: |
          pip install --quiet pybritive
          pybritive ls profiles -t bira.pr2.aws --federation-provider github-britive
